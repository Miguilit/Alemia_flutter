name: eduex_app
description: Alemia Learning Platform
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.9
  hugeicons: ^1.1.1
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.2.2
  webview_flutter: ^4.4.2
  http: ^1.2.0
  provider: ^6.1.1
  intl: ^0.20.2
  razorpay_flutter: ^1.4.1
  toastification: ^3.0.3
  shimmer: ^3.0.0
  flutter_widget_from_html: ^0.17.1
  youtube_player_flutter: ^9.1.1
  video_player: ^2.9.1
  vimeo_video_player: ^1.0.3
  chewie: ^1.13.0
  share_plus: ^12.0.1
  url_launcher: ^6.3.2
  flutter_sslcommerz: ^3.0.1
  flutter_stripe: ^12.1.1

  mollie_flutter:
    git:
      url: https://github.com/gauravmehta13/mollie_flutter.git
      ref: master
  image_picker: ^1.2.1
  flutter_html: ^3.0.0-beta.2
  file_picker: ^10.3.10
  path_provider: ^2.1.4
  permission_handler: ^12.0.1
  open_filex: ^4.7.0
  no_screenshot: ^1.1.0
  flutter_markdown_plus: ^1.0.7
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

dependency_overrides:
  intl: 0.20.2


flutter:
  uses-material-design: true

  assets:
    - assets/img/onboarding/
    - assets/img/courses/
    - assets/img/profile/
    - assets/img/icons/
    - assets/img/banner.png
    - assets/img/banner2.png
    - assets/img/default-profile.png
    - assets/img/icon.png
    - assets/img/splash.png
    - assets/img/loader.gif
    - assets/img/logo.svg
    - assets/img/logo_white.svg
    - assets/img/qr-code.jpg
    - assets/video/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/montserrat/static/Montserrat-Thin.ttf
          weight: 100
        - asset: assets/fonts/montserrat/static/Montserrat-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/montserrat/static/Montserrat-Light.ttf
          weight: 300
        - asset: assets/fonts/montserrat/static/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/montserrat/static/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/montserrat/static/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/montserrat/static/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/montserrat/static/Montserrat-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/montserrat/static/Montserrat-Black.ttf
          weight: 900
        - asset: assets/fonts/montserrat/static/Montserrat-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/montserrat/static/Montserrat-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/montserrat/static/Montserrat-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/montserrat/static/Montserrat-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/montserrat/static/Montserrat-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/montserrat/static/Montserrat-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/montserrat/static/Montserrat-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/montserrat/static/Montserrat-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/montserrat/static/Montserrat-BlackItalic.ttf
          weight: 900
          style: italic

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
  image_path: "assets/img/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#071A17"
  adaptive_icon_foreground: "assets/img/icon.png"

flutter_native_splash:
  color: "#071A17"
  image: "assets/img/splash.png"
  android: true
  ios: true
  web: false

  android_12:
    color: "#071A17"
    image: "assets/img/splash.png"
